services:
  # FastAPI Backend
  - type: web
    name: hintify-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hintify-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health

  # PostgreSQL Database
  - type: pgsql
    name: hintify-db
    region: oregon
    plan: free
    databaseName: hintify
    databaseUser: hintify_user

  # Static Frontend (Optional - if you want to serve frontend separately)
  - type: web
    name: hintify-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "echo 'No build needed for static site'"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
