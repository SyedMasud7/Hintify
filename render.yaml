services:
  # FastAPI Backend
  - type: web
    name: hintify-backend
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hintify-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health

  # PostgreSQL Database
  - type: pgsql
    name: hintify-db
    region: singapore
    plan: free
    databaseName: hintify
    databaseUser: hintify_user
